services:
  - type: web
    name: toolbox-hub-backend
    env: python
    buildCommand: "cd backend && chmod +x render-build.sh && ./render-build.sh"
    startCommand: "cd backend && export PATH=$PATH:$(pwd)/ffmpeg && gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --max-requests 200 --max-requests-jitter 50"
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./toolbox_hub.db"
      - key: CORS_ORIGINS
        value: "https://tool-box-hub-pi.vercel.app"
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: APP_NAME
        value: "ToolboxHub"
