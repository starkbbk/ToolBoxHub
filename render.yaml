services:
  - type: web
    name: toolbox-hub-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./toolbox_hub.db"
      - key: CORS_ORIGINS
        value: "https://toolbox-hub.vercel.app" # Placeholder: Update with your Vercel URL
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: APP_NAME
        value: "ToolboxHub"

  - type: web
    name: toolbox-hub-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://toolbox-hub-backend.onrender.com" # Placeholder: Update with your Render URL
      - key: NEXT_PUBLIC_WS_URL
        value: "wss://toolbox-hub-backend.onrender.com"
